<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>局域网连接</title>
    <link rel="stylesheet" href="./?getAssets=bootstrap.min.css">
    <script type="application/javascript" src="./?getAssets=jquary34.js"></script>
    <script type="application/javascript" src="./?getAssets=bootstrap.min.js"></script>
    <script>
        var currentPath = null;
        var RECENT_KEY = "udpchat_recent_folders"; // 最近访问文件夹（最多10个）
        var copiedPath = null;                      // 右键“复制”的文件路径
        var ctxPath = null;
        var ctxIsFile = true;

        function iconFor(type) {
            switch (type) {
                case "folder":
                    return "<svg viewBox='0 0 24 24' width='40' height='40' fill='#ffb300'><path d='M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z'/></svg>";
                case "image":
                    return "<svg viewBox='0 0 24 24' width='40' height='40' fill='#42a5f5'><path d='M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z'/></svg>";
                case "video":
                    return "<svg viewBox='0 0 24 24' width='40' height='40' fill='#ef5350'><path d='M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z'/></svg>";
                case "audio":
                    return "<svg viewBox='0 0 24 24' width='40' height='40' fill='#66bb6a'><path d='M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z'/></svg>";
                default:
                    return "<svg viewBox='0 0 24 24' width='40' height='40' fill='#90a4ae'><path d='M6 2c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z'/></svg>";
            }
        }

        function iconEl(type) {
            let s = document.createElement("span");
            s.className = "ic";
            s.innerHTML = iconFor(type);
            return s;
        }

        function previewUrl(path) {
            return "?getjson=1&checkpass=replace_pass&preview=1&filepath=" + encodeURIComponent(path);
        }
        function downloadUrl(path) {
            return "?getjson=1&checkpass=replace_pass&filepath=" + encodeURIComponent(path);
        }

        function Get(url) {
            let xmlhttprequest = new XMLHttpRequest();
            let tt = new Date();
            xmlhttprequest.open("GET", url + "&checkpass=replace_pass&time=" + tt.getTime(), false);
            xmlhttprequest.send(null);
            return xmlhttprequest.responseText;
        }

        function getfile(path) {
            window.open(downloadUrl(path));
        }

        function formatSize(b) {
            b = b || 0;
            if (b < 1024) return b + " B";
            if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
            if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB";
            return (b / 1073741824).toFixed(1) + " GB";
        }

        function basename(p) {
            let parts = (p || "").split(/[\\/]+/).filter(s => s.length > 0);
            return parts.length ? parts[parts.length - 1] : (p || "");
        }

        // ====== 最近访问（快捷方式）======
        function loadRecents() {
            try {
                let raw = localStorage.getItem(RECENT_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) { return []; }
        }
        function saveRecents(arr) {
            try { localStorage.setItem(RECENT_KEY, JSON.stringify(arr)); } catch (e) {}
        }
        function addRecent(path) {
            if (!path) return;
            let arr = loadRecents();
            arr = arr.filter(p => p !== path);
            arr.unshift(path);
            if (arr.length > 10) arr = arr.slice(0, 10);
            saveRecents(arr);
            renderRecents();
        }
        function removeRecent(path) {
            let arr = loadRecents().filter(p => p !== path);
            saveRecents(arr);
            renderRecents();
        }
        function clearRecents() {
            saveRecents([]);
            renderRecents();
        }
        function renderRecents() {
            let arr = loadRecents();
            let box = document.getElementById("div_recent");
            box.innerHTML = "";
            if (arr.length === 0) {
                let tip = document.createElement("div");
                tip.className = "text-secondary";
                tip.style.fontSize = "12px";
                tip.textContent = "暂无最近访问的文件夹";
                box.appendChild(tip);
                return;
            }
            for (let p of arr) {
                let row = document.createElement("div");
                row.className = "recent-item";
                row.appendChild(iconEl("folder"));
                let nm = document.createElement("div");
                nm.className = "recent-name";
                let b = document.createElement("div");
                b.className = "name";
                b.textContent = basename(p);
                let pp = document.createElement("div");
                pp.className = "path";
                pp.textContent = p;
                nm.appendChild(b);
                nm.appendChild(pp);
                row.appendChild(nm);
                row.addEventListener("click", function () { gotoRecent(p); });
                box.appendChild(row);
            }
        }
        function gotoRecent(path) {
            selectFolder(path);
        }

        // ====== 左侧树状目录 ======
        function depthOf(node) {
            let d = 0, p = node.parentElement;
            while (p) {
                if (p.classList.contains("tree-node")) d++;
                p = p.parentElement;
            }
            return d;
        }

        function buildTreeNode(item, depth) {
            let path = item.filepath;
            let node = document.createElement("div");
            node.className = "tree-node";
            node.style.paddingLeft = (depth * 16 + 4) + "px";
            node.dataset.path = path;

            let twisty = document.createElement("span");
            twisty.className = "twisty";
            twisty.textContent = "►";

            let label = document.createElement("span");
            label.className = "tree-label";
            label.appendChild(iconEl("folder"));
            let nm = document.createElement("span");
            nm.className = "name";
            nm.textContent = item.filename;
            label.appendChild(nm);

            let children = document.createElement("div");
            children.className = "tree-children";
            children.style.display = "none";

            node.appendChild(twisty);
            node.appendChild(label);
            node.appendChild(children);

            twisty.addEventListener("click", function (e) {
                e.stopPropagation();
                toggleNode(node);
            });
            label.addEventListener("click", function () {
                let c = node.querySelector(":scope > .tree-children");
                if (c && c.dataset.loaded !== "1") {
                    loadChildrenInto(node, c, depthOf(node) + 1);
                }
                expandNode(node);
                selectFolder(node.dataset.path);
            });

            return node;
        }

        function expandNode(node) {
            let children = node.querySelector(":scope > .tree-children");
            if (children) {
                children.style.display = "block";
                let tw = node.querySelector(":scope > .twisty");
                if (tw) tw.textContent = "▼";
            }
        }

        function collapseNode(node) {
            let children = node.querySelector(":scope > .tree-children");
            if (children) {
                children.style.display = "none";
                let tw = node.querySelector(":scope > .twisty");
                if (tw) tw.textContent = "►";
            }
        }

        function toggleNode(node) {
            let children = node.querySelector(":scope > .tree-children");
            let isOpen = children && children.style.display === "block";
            if (isOpen) {
                collapseNode(node);
            } else {
                if (children && children.dataset.loaded !== "1") {
                    loadChildrenInto(node, children, depthOf(node) + 1);
                }
                expandNode(node);
            }
        }

        function loadChildrenInto(node, children, depth) {
            let sub;
            try {
                sub = JSON.parse(Get("./?getjson=1&getjson_onlyfolder=1&filepath=" + encodeURIComponent(node.dataset.path)));
            } catch (e) {
                sub = [];
            }
            for (let it of sub) children.appendChild(buildTreeNode(it, depth));
            children.dataset.loaded = "1";
        }

        function ancestorsOf(path) {
            if (/^[A-Za-z]:[\\/]/.test(path)) {
                let parts = path.split(/[\\/]+/).filter(s => s.length > 0);
                let list = [];
                let cur = parts[0] + "\\";
                list.push(cur);
                for (let i = 1; i < parts.length; i++) {
                    cur = cur + parts[i];
                    list.push(cur);
                    cur = cur + "\\";
                }
                return list;
            } else {
                let parts = path.split("/").filter(s => s.length > 0);
                let list = [];
                let cur = "/";
                list.push(cur);
                for (let i = 0; i < parts.length; i++) {
                    cur = cur + parts[i];
                    list.push(cur);
                    cur = cur + "/";
                }
                return list;
            }
        }

        function findChildByPath(container, p) {
            let kids = container.querySelectorAll(":scope > .tree-node");
            for (let k of kids) {
                if (k.dataset.path === p) return k;
            }
            return null;
        }

        function revealInTree(path) {
            let chain = ancestorsOf(path);
            let topNodes = document.querySelectorAll("#div_tree > .tree-node");
            let startNode = null;
            for (let n of topNodes) {
                let pp = n.dataset.path;
                if (pp === path) { startNode = n; break; }
                if (path.length > pp.length && path.indexOf(pp) === 0 &&
                    (pp.endsWith("\\") || pp.endsWith("/") || path.charAt(pp.length) === "\\" || path.charAt(pp.length) === "/")) {
                    startNode = n; break;
                }
            }
            if (!startNode) return;
            expandNode(startNode);
            let node = startNode;
            let covered = ancestorsOf(startNode.dataset.path).length;
            for (let i = covered; i < chain.length; i++) {
                let children = node.querySelector(":scope > .tree-children");
                if (!children) {
                    children = document.createElement("div");
                    children.className = "tree-children";
                    node.appendChild(children);
                }
                if (children.dataset.loaded !== "1") {
                    loadChildrenInto(node, children, depthOf(node) + 1);
                }
                let child = findChildByPath(children, chain[i]);
                if (!child) break;
                expandNode(child);
                node = child;
            }
        }

        function findNodeByPath(path) {
            let nodes = document.querySelectorAll(".tree-node");
            for (let n of nodes) {
                if (n.dataset.path === path) return n;
            }
            return null;
        }

        function buildTree() {
            let roots = JSON.parse(Get("./?getjson=1&getjson_onlyfolder=1"));
            let tree = document.getElementById("div_tree");
            tree.innerHTML = "";
            for (let it of roots) tree.appendChild(buildTreeNode(it, 0));
        }

        // ====== 右侧文件网格 ======
        function buildItem(item) {
            let path = item.filepath;
            let wrap = document.createElement("div");
            wrap.className = "grid-item";
            wrap.dataset.path = path;
            wrap._item = item;
            wrap.draggable = true;
            wrap.addEventListener("dragstart", function (e) {
                e.dataTransfer.setData("text/plain", path);
                e.dataTransfer.effectAllowed = "move";
            });

            if (!item.isFile) {
                wrap.classList.add("folder");
                let tw = document.createElement("div");
                tw.className = "thumb-wrap";
                tw.appendChild(iconEl("folder"));
                let nm = document.createElement("div");
                nm.className = "name";
                nm.textContent = item.filename;
                let meta = document.createElement("div");
                meta.className = "meta";
                let act = document.createElement("div");
                act.className = "actions";
                act.innerHTML = "<span class='dl'>打开</span>";
                wrap.appendChild(tw);
                wrap.appendChild(nm);
                wrap.appendChild(meta);
                wrap.appendChild(act);
                wrap.addEventListener("click", function () { selectFolder(path); });
                return wrap;
            }

            let media;
            if (item.type === "image") {
                media = document.createElement("a");
                media.href = "#";
                media.className = "thumb-wrap";
                let img = document.createElement("img");
                img.className = "thumb";
                img.loading = "lazy";
                img.src = previewUrl(path);
                media.appendChild(img);
                media.addEventListener("click", function (e) {
                    e.preventDefault();
                    openLightbox(img.src);
                });
            } else if (item.type === "video") {
                media = document.createElement("video");
                media.className = "thumb";
                media.preload = "metadata";
                media.controls = true;
                media.src = previewUrl(path);
            } else if (item.type === "audio") {
                media = document.createElement("audio");
                media.className = "audio-player";
                media.controls = true;
                media.src = previewUrl(path);
            } else {
                media = document.createElement("div");
                media.className = "thumb-wrap";
                media.appendChild(iconEl(item.type));
            }

            let nm = document.createElement("div");
            nm.className = "name";
            nm.textContent = item.filename;
            let meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = formatSize(item.size);
            let act = document.createElement("div");
            act.className = "actions";
            if (item.type === "image") {
                let view = document.createElement("a");
                view.className = "dl";
                view.href = "#";
                view.textContent = "查看";
                view.addEventListener("click", function (e) {
                    e.preventDefault();
                    openLightbox(previewUrl(path));
                });
                let sep = document.createElement("span");
                sep.textContent = " ";
                let dl = document.createElement("a");
                dl.className = "dl";
                dl.href = "#";
                dl.textContent = "下载";
                dl.addEventListener("click", function (e) {
                    e.preventDefault();
                    getfile(path);
                });
                act.appendChild(view);
                act.appendChild(sep);
                act.appendChild(dl);
            } else if (item.type === "video") {
                let view = document.createElement("a");
                view.className = "dl";
                view.href = "#";
                view.textContent = "查看";
                view.addEventListener("click", function (e) {
                    e.preventDefault();
                    openLightbox(previewUrl(path), true);
                });
                let sep = document.createElement("span");
                sep.textContent = " ";
                let dl = document.createElement("a");
                dl.className = "dl";
                dl.href = "#";
                dl.textContent = "下载";
                dl.addEventListener("click", function (e) {
                    e.preventDefault();
                    getfile(path);
                });
                act.appendChild(view);
                act.appendChild(sep);
                act.appendChild(dl);
            } else {
                let dl = document.createElement("a");
                dl.className = "dl";
                dl.href = "#";
                dl.textContent = "下载";
                dl.addEventListener("click", function (e) {
                    e.preventDefault();
                    getfile(path);
                });
                act.appendChild(dl);
            }

            wrap.appendChild(media);
            wrap.appendChild(nm);
            wrap.appendChild(meta);
            wrap.appendChild(act);
            return wrap;
        }

        function renderGrid(items) {
            let grid = document.getElementById("div_grid");
            grid.innerHTML = "";
            for (let item of items) grid.appendChild(buildItem(item));
        }

        function loadContents(path) {
            let url = path
                ? ("./?getjson=1&filepath=" + encodeURIComponent(path))
                : ("./?getjson=1");
            let items = JSON.parse(Get(url));
            renderGrid(items);
            document.getElementById("title_replace").textContent = path ? path : "根目录";
        }

        function selectFolder(path) {
            if (path) addRecent(path);
            currentPath = path;
            revealInTree(path);
            let nodes = document.querySelectorAll(".tree-node");
            for (let n of nodes) n.classList.remove("active");
            let node = findNodeByPath(path);
            if (node) node.classList.add("active");
            loadContents(path);
        }

        // 灯箱预览：图片或视频大屏查看
        function openLightbox(src, isVideo) {
            let img = document.getElementById("lightbox_img");
            let vid = document.getElementById("lightbox_video");
            if (isVideo) {
                img.style.display = "none";
                vid.style.display = "block";
                vid.src = src;
                vid.play().catch(function () {});
            } else {
                if (vid) { vid.pause(); vid.removeAttribute("src"); vid.style.display = "none"; }
                img.style.display = "block";
                img.src = src;
            }
            document.getElementById("lightbox").style.display = "flex";
        }
        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
            let vid = document.getElementById("lightbox_video");
            if (vid) { vid.pause(); vid.removeAttribute("src"); vid.style.display = "none"; }
            let img = document.getElementById("lightbox_img");
            img.src = "";
            img.style.display = "block";
        }

        // ====== 上传 / 拖拽上传 ======
        function uploadFiles(fileList, targetDir) {
            let dir = targetDir || "";
            let pending = fileList.length;
            if (pending === 0) return;
            for (let f of fileList) {
                let url = "./?upload=1&checkpass=replace_pass&filepath=" + encodeURIComponent(dir)
                        + "&filename=" + encodeURIComponent(f.name);
                fetch(url, { method: "POST", body: f })
                    .then(resp => resp.text())
                    .then(t => {
                        if (t !== "OK") alert("上传失败: " + t);
                        pending--;
                        if (pending === 0) afterUpload(dir);
                    })
                    .catch(e => {
                        alert("上传失败");
                        pending--;
                        if (pending === 0) afterUpload(dir);
                    });
            }
        }
        function afterUpload(target) {
            if (target && target !== currentPath) selectFolder(target);
            else loadContents(currentPath);
        }

        // ====== 右键菜单：删除 / 复制 / 粘贴（全网页生效）======
        var ctxItem = null;
        function showCtxMenu(x, y) {
            let menu = document.getElementById("ctxMenu");
            menu.style.display = "block";
            // 视口内夹紧，避免溢出
            let px = Math.min(x, window.innerWidth - 160);
            let py = Math.min(y, window.innerHeight - 120);
            menu.style.left = px + "px";
            menu.style.top = py + "px";
            document.getElementById("ctx_delete").style.display = (ctxItem ? "block" : "none");
            document.getElementById("ctx_copy").style.display = (ctxItem ? "block" : "none");
            document.getElementById("ctx_paste").style.display = (copiedPath ? "block" : "none");
        }
        function hideCtx() {
            document.getElementById("ctxMenu").style.display = "none";
        }
        // 整个网页拦截原生右键菜单，弹出自定义菜单（空区域只显示“粘贴”）
        document.addEventListener("contextmenu", function (e) {
            e.preventDefault();
            let itemEl = e.target.closest(".grid-item");
            if (itemEl && itemEl._item) {
                ctxItem = itemEl._item;
                ctxPath = ctxItem.filepath;
                ctxIsFile = ctxItem.isFile;
            } else {
                ctxItem = null;
                ctxPath = null;
                ctxIsFile = true;
            }
            showCtxMenu(e.clientX, e.clientY);
        });
        function deleteFile(p) {
            if (!confirm("确定删除该文件/文件夹？此操作不可恢复。")) return;
            let url = "./?delete=1&checkpass=replace_pass&filepath=" + encodeURIComponent(p);
            fetch(url, { method: "POST" })
                .then(r => r.text())
                .then(t => {
                    if (t !== "OK") alert("删除失败: " + t);
                    removeRecent(p);
                    if (currentPath && p === currentPath) loadContents(null);
                    else loadContents(currentPath);
                })
                .catch(e => alert("删除失败"));
        }
        function copyFile(from, toDir) {
            let url = "./?copy=1&checkpass=replace_pass&from=" + encodeURIComponent(from)
                    + "&to=" + encodeURIComponent(toDir);
            fetch(url, { method: "POST" })
                .then(r => r.text())
                .then(t => {
                    if (t !== "OK") alert("粘贴失败: " + t);
                    loadContents(currentPath);
                })
                .catch(e => alert("粘贴失败"));
        }
        function moveFile(from, toDir) {
            let url = "./?move=1&checkpass=replace_pass&from=" + encodeURIComponent(from)
                    + "&to=" + encodeURIComponent(toDir);
            fetch(url, { method: "POST" })
                .then(r => r.text())
                .then(t => {
                    if (t !== "OK") alert("移动失败: " + t);
                    loadContents(currentPath);
                })
                .catch(e => alert("移动失败"));
        }
        // 拖到左侧树文件夹：OS文件→上传，应用内文件→移动
        function handleDropOnFolder(targetPath, e) {
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                uploadFiles(e.dataTransfer.files, targetPath);
            } else {
                let from = e.dataTransfer.getData("text/plain");
                if (from) moveFile(from, targetPath);
            }
        }

        // ====== 拖拽高亮 / 落点判定 ======
        let dragTarget = null;
        function clearDragHighlight() {
            if (dragTarget) {
                dragTarget.classList.remove("drop-hover");
                dragTarget = null;
            }
        }
        function initDragDrop() {
            let grid = document.getElementById("div_grid");
            grid.addEventListener("dragover", function (e) {
                e.preventDefault();
                let folderEl = e.target.closest(".grid-item.folder");
                if (folderEl !== dragTarget) {
                    clearDragHighlight();
                    dragTarget = folderEl;
                    if (dragTarget) dragTarget.classList.add("drop-hover");
                }
            });
            grid.addEventListener("dragleave", function (e) {
                if (!grid.contains(e.relatedTarget)) clearDragHighlight();
            });
            grid.addEventListener("drop", function (e) {
                e.preventDefault();
                if (dragTarget) {
                    // 拖到网格内的文件夹：OS 文件→上传，应用内文件→移动
                    let tp = dragTarget.dataset.path;
                    clearDragHighlight();
                    handleDropOnFolder(tp, e);
                } else if (e.dataTransfer && e.dataTransfer.files.length) {
                    // 拖到空白区域：作为上传到当前目录
                    uploadFiles(e.dataTransfer.files, currentPath || "");
                }
            });
        }

        // 左侧树：容器级拖拽处理，用 closest('.tree-node') 只高亮光标下最内层的节点，
        // 避免拖拽事件冒泡导致所有祖先文件夹都被高亮。
        function initTreeDrop() {
            let tree = document.getElementById("div_tree");
            tree.addEventListener("dragover", function (e) {
                e.preventDefault();
                let node = e.target.closest(".tree-node");
                if (node !== dragTarget) {
                    clearDragHighlight();
                    dragTarget = node; // 可能为 null（拖到树空白处），不高亮
                    if (dragTarget) dragTarget.classList.add("drop-hover");
                }
            });
            tree.addEventListener("dragleave", function (e) {
                // 只有当真正离开树容器（relatedTarget 不在树内）时才清除
                if (!tree.contains(e.relatedTarget)) clearDragHighlight();
            });
            tree.addEventListener("drop", function (e) {
                e.preventDefault();
                let node = e.target.closest(".tree-node");
                clearDragHighlight();
                if (node) handleDropOnFolder(node.dataset.path, e);
            });
        }

        function f() {
            document.getElementById("btn_clear_recent").addEventListener("click", clearRecents);
            document.getElementById("btn_upload").addEventListener("click", function () {
                document.getElementById("file_input").click();
            });
            document.getElementById("file_input").addEventListener("change", function (e) {
                if (e.target.files.length) uploadFiles(e.target.files, currentPath || "");
                e.target.value = "";
            });

            // 右键菜单交互
            document.addEventListener("click", hideCtx);
            document.getElementById("ctxMenu").addEventListener("click", function (e) { e.stopPropagation(); });
            document.getElementById("ctx_delete").addEventListener("click", function () { hideCtx(); deleteFile(ctxPath); });
            document.getElementById("ctx_copy").addEventListener("click", function () { copiedPath = ctxPath; hideCtx(); });
            document.getElementById("ctx_paste").addEventListener("click", function () { if (copiedPath) copyFile(copiedPath, currentPath || ""); hideCtx(); });

            initDragDrop();
            initTreeDrop();
            buildTree();
            loadContents(null);
            renderRecents();
        }
    </script>
