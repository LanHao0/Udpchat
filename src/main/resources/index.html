<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>局域网连接</title>
    <link rel="stylesheet" href="./?getAssets=bootstrap.min.css">
    <script type="application/javascript" src="./?getAssets=jquary34.js"></script>
    <script type="application/javascript" src="./?getAssets=bootstrap.min.js"></script>
    <script>
        var currentPath = null;
        var RECENT_KEY = "udpchat_recent_folders"; // 最近访问文件夹（最多10个）

        function iconFor(type) {
            switch (type) {
                case "folder":
                    return "<svg viewBox='0 0 24 24' width='24' height='24' fill='#ffb300'><path d='M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z'/></svg>";
                case "image":
                    return "<svg viewBox='0 0 24 24' width='24' height='24' fill='#42a5f5'><path d='M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z'/></svg>";
                case "video":
                    return "<svg viewBox='0 0 24 24' width='24' height='24' fill='#ef5350'><path d='M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z'/></svg>";
                case "audio":
                    return "<svg viewBox='0 0 24 24' width='24' height='24' fill='#66bb6a'><path d='M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z'/></svg>";
                default:
                    return "<svg viewBox='0 0 24 24' width='24' height='24' fill='#90a4ae'><path d='M6 2c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z'/></svg>";
            }
        }

        function iconEl(type) {
            let s = document.createElement("span");
            s.className = "ic";
            s.innerHTML = iconFor(type);
            return s;
        }

        function previewUrl(path) {
            return "?getjson=1&checkpass=replace_pass&preview=1&filepath=" + encodeURIComponent(path);
        }
        function downloadUrl(path) {
            return "?getjson=1&checkpass=replace_pass&filepath=" + encodeURIComponent(path);
        }

        function Get(url) {
            let xmlhttprequest = new XMLHttpRequest();
            let tt = new Date();
            xmlhttprequest.open("GET", url + "&checkpass=replace_pass&time=" + tt.getTime(), false);
            xmlhttprequest.send(null);
            return xmlhttprequest.responseText;
        }

        function getfile(path) {
            window.open(downloadUrl(path));
        }

        function formatSize(b) {
            b = b || 0;
            if (b < 1024) return b + " B";
            if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
            if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB";
            return (b / 1073741824).toFixed(1) + " GB";
        }

        function basename(p) {
            let parts = (p || "").split(/[\\/]+/).filter(s => s.length > 0);
            return parts.length ? parts[parts.length - 1] : (p || "");
        }

        // ====== 最近访问（快捷方式）======
        function loadRecents() {
            try {
                let raw = localStorage.getItem(RECENT_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) { return []; }
        }
        function saveRecents(arr) {
            try { localStorage.setItem(RECENT_KEY, JSON.stringify(arr)); } catch (e) {}
        }
        function addRecent(path) {
            if (!path) return;
            let arr = loadRecents();
            arr = arr.filter(p => p !== path); // 去重
            arr.unshift(path);
            if (arr.length > 10) arr = arr.slice(0, 10);
            saveRecents(arr);
            renderRecents();
        }
        function clearRecents() {
            saveRecents([]);
            renderRecents();
        }
        function renderRecents() {
            let arr = loadRecents();
            let box = document.getElementById("div_recent");
            box.innerHTML = "";
            if (arr.length === 0) {
                let tip = document.createElement("div");
                tip.className = "text-secondary";
                tip.style.fontSize = "12px";
                tip.textContent = "暂无最近访问的文件夹";
                box.appendChild(tip);
                return;
            }
            for (let p of arr) {
                let row = document.createElement("div");
                row.className = "recent-item";
                row.appendChild(iconEl("folder"));
                let nm = document.createElement("div");
                nm.className = "recent-name";
                let b = document.createElement("div");
                b.className = "name";
                b.textContent = basename(p);
                let pp = document.createElement("div");
                pp.className = "path";
                pp.textContent = p;
                nm.appendChild(b);
                nm.appendChild(pp);
                row.appendChild(nm);
                row.addEventListener("click", function () { gotoRecent(p); });
                box.appendChild(row);
            }
        }
        function gotoRecent(path) {
            showTab("tree");
            selectFolder(path);
        }

        // ====== 标签切换：快捷方式 / 文件树 ======
        function showTab(name) {
            let tabs = document.querySelectorAll("#treeTabs .nav-link");
            for (let t of tabs) t.classList.toggle("active", t.dataset.tab === name);
            document.getElementById("panel_quick").style.display = (name === "quick") ? "block" : "none";
            document.getElementById("panel_tree").style.display = (name === "tree") ? "block" : "none";
        }

        // ====== 左侧树状目录 ======
        function depthOf(node) {
            let d = 0, p = node.parentElement;
            while (p) {
                if (p.classList.contains("tree-node")) d++;
                p = p.parentElement;
            }
            return d;
        }

        function buildTreeNode(item, depth) {
            let path = item.filepath;
            let node = document.createElement("div");
            node.className = "tree-node";
            node.style.paddingLeft = (depth * 16 + 4) + "px";
            node.dataset.path = path;

            let twisty = document.createElement("span");
            twisty.className = "twisty";
            twisty.textContent = "►";

            let label = document.createElement("span");
            label.className = "tree-label";
            label.appendChild(iconEl("folder"));
            let nm = document.createElement("span");
            nm.className = "name";
            nm.textContent = item.filename;
            label.appendChild(nm);

            let children = document.createElement("div");
            children.className = "tree-children";
            children.style.display = "none";

            node.appendChild(twisty);
            node.appendChild(label);
            node.appendChild(children);

            // 点击箭头：展开/折叠切换
            twisty.addEventListener("click", function (e) {
                e.stopPropagation();
                toggleNode(node);
            });
            // 点击文件名：展开并加载右侧内容
            label.addEventListener("click", function () {
                let c = node.querySelector(":scope > .tree-children");
                if (c && c.dataset.loaded !== "1") {
                    loadChildrenInto(node, c, depthOf(node) + 1);
                }
                expandNode(node);
                selectFolder(node.dataset.path);
            });
            return node;
        }

        function expandNode(node) {
            let children = node.querySelector(":scope > .tree-children");
            if (children) {
                children.style.display = "block";
                let tw = node.querySelector(":scope > .twisty");
                if (tw) tw.textContent = "▼";
            }
        }

        function collapseNode(node) {
            let children = node.querySelector(":scope > .tree-children");
            if (children) {
                children.style.display = "none";
                let tw = node.querySelector(":scope > .twisty");
                if (tw) tw.textContent = "►";
            }
        }

        function toggleNode(node) {
            let children = node.querySelector(":scope > .tree-children");
            let isOpen = children && children.style.display === "block";
            if (isOpen) {
                collapseNode(node);
            } else {
                if (children && children.dataset.loaded !== "1") {
                    loadChildrenInto(node, children, depthOf(node) + 1);
                }
                expandNode(node);
            }
        }

        function loadChildrenInto(node, children, depth) {
            let sub;
            try {
                sub = JSON.parse(Get("./?getjson=1&getjson_onlyfolder=1&filepath=" + encodeURIComponent(node.dataset.path)));
            } catch (e) {
                sub = [];
            }
            for (let it of sub) children.appendChild(buildTreeNode(it, depth));
            children.dataset.loaded = "1";
        }

        // 把绝对路径拆成从根到自身的各级祖先路径
        function ancestorsOf(path) {
            if (/^[A-Za-z]:[\\/]/.test(path)) { // Windows
                let parts = path.split(/[\\/]+/).filter(s => s.length > 0);
                let list = [];
                let cur = parts[0] + "\\";
                list.push(cur);
                for (let i = 1; i < parts.length; i++) {
                    cur = cur + parts[i];
                    list.push(cur);
                    cur = cur + "\\";
                }
                return list;
            } else { // Unix / Android
                let parts = path.split("/").filter(s => s.length > 0);
                let list = [];
                let cur = "/";
                list.push(cur);
                for (let i = 0; i < parts.length; i++) {
                    cur = cur + parts[i];
                    list.push(cur);
                    cur = cur + "/";
                }
                return list;
            }
        }

        function findChildByPath(container, p) {
            let kids = container.querySelectorAll(":scope > .tree-node");
            for (let k of kids) {
                if (k.dataset.path === p) return k;
            }
            return null;
        }

        // 让目标路径在左侧树中展开可见（逐级懒加载父目录）
        function revealInTree(path) {
            let chain = ancestorsOf(path);
            let topNodes = document.querySelectorAll("#div_tree > .tree-node");
            let startNode = null;
            for (let n of topNodes) {
                let pp = n.dataset.path;
                if (pp === path) { startNode = n; break; }
                if (path.length > pp.length && path.indexOf(pp) === 0 &&
                    (pp.endsWith("\\") || pp.endsWith("/") || path.charAt(pp.length) === "\\" || path.charAt(pp.length) === "/")) {
                    startNode = n; break;
                }
            }
            if (!startNode) return;
            expandNode(startNode);
            let node = startNode;
            let covered = ancestorsOf(startNode.dataset.path).length; // 起始节点自身已覆盖的层级数
            for (let i = covered; i < chain.length; i++) {
                let children = node.querySelector(":scope > .tree-children");
                if (!children) {
                    children = document.createElement("div");
                    children.className = "tree-children";
                    node.appendChild(children);
                }
                if (children.dataset.loaded !== "1") {
                    loadChildrenInto(node, children, depthOf(node) + 1);
                }
                let child = findChildByPath(children, chain[i]);
                if (!child) break;
                expandNode(child);
                node = child;
            }
        }

        function findNodeByPath(path) {
            let nodes = document.querySelectorAll(".tree-node");
            for (let n of nodes) {
                if (n.dataset.path === path) return n;
            }
            return null;
        }

        function buildTree() {
            let roots = JSON.parse(Get("./?getjson=1&getjson_onlyfolder=1"));
            let tree = document.getElementById("div_tree");
            tree.innerHTML = "";
            for (let it of roots) tree.appendChild(buildTreeNode(it, 0));
        }

        // ====== 右侧文件网格 ======
        function buildItem(item) {
            let path = item.filepath;
            let wrap = document.createElement("div");
            wrap.className = "grid-item";

            if (!item.isFile) {
                wrap.classList.add("folder");
                wrap.appendChild(iconEl("folder"));
                let nm = document.createElement("div");
                nm.className = "name";
                nm.textContent = item.filename;
                wrap.appendChild(nm);
                let sz = document.createElement("div");
                sz.className = "size";
                sz.textContent = "";
                wrap.appendChild(sz);
                wrap.addEventListener("click", function () {
                    selectFolder(path);
                });
            } else {
                if (item.type === "image") {
                    let a = document.createElement("a");
                    a.href = "#";
                    a.className = "thumb-wrap";
                    let img = document.createElement("img");
                    img.className = "thumb";
                    img.loading = "lazy";
                    img.src = previewUrl(path);
                    a.appendChild(img);
                    a.addEventListener("click", function (e) {
                        e.preventDefault();
                        openLightbox(img.src);
                    });
                    wrap.appendChild(a);
                } else if (item.type === "video") {
                    let v = document.createElement("video");
                    v.className = "thumb";
                    v.preload = "metadata";
                    v.controls = true;
                    v.src = previewUrl(path);
                    wrap.appendChild(v);
                } else {
                    wrap.appendChild(iconEl(item.type));
                }
                let nm = document.createElement("div");
                nm.className = "name";
                nm.textContent = item.filename;
                wrap.appendChild(nm);
                let sz = document.createElement("div");
                sz.className = "size";
                sz.textContent = formatSize(item.size);
                wrap.appendChild(sz);
                if (item.type !== "video") {
                    let dl = document.createElement("a");
                    dl.className = "dl";
                    dl.href = "#";
                    dl.textContent = "下载";
                    dl.addEventListener("click", function (e) {
                        e.preventDefault();
                        getfile(path);
                    });
                    wrap.appendChild(dl);
                }
            }
            return wrap;
        }

        function renderGrid(items) {
            let grid = document.getElementById("div_grid");
            grid.innerHTML = "";
            for (let item of items) grid.appendChild(buildItem(item));
        }

        function loadContents(path) {
            let url = path
                ? ("./?getjson=1&filepath=" + encodeURIComponent(path))
                : ("./?getjson=1");
            let items = JSON.parse(Get(url));
            renderGrid(items);
            document.getElementById("title_replace").textContent = path ? path : "根目录";
        }

        function selectFolder(path) {
            if (path) addRecent(path); // 记录最近访问，用于快捷方式
            currentPath = path;
            revealInTree(path);
            let nodes = document.querySelectorAll(".tree-node");
            for (let n of nodes) n.classList.remove("active");
            let node = findNodeByPath(path);
            if (node) node.classList.add("active");
            loadContents(path);
        }

        // 图片灯箱预览
        function openLightbox(src) {
            document.getElementById("lightbox_img").src = src;
            document.getElementById("lightbox").style.display = "flex";
        }
        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
            document.getElementById("lightbox_img").src = "";
        }

        function f() {
            // 标签点击
            document.querySelectorAll("#treeTabs .nav-link").forEach(function (a) {
                a.addEventListener("click", function () { showTab(a.dataset.tab); });
            });
            document.getElementById("btn_clear_recent").addEventListener("click", clearRecents);

            buildTree();
            loadContents(null);
            renderRecents();
            showTab("quick"); // 默认展示快捷方式
        }
    </script>
    <style>
        .card { transition: all .5s; }
        .card:hover { box-shadow: 0 0 8px #0c5460; }

        /* 左侧：标签 */
        #treeTabs { margin-bottom: 8px; border-bottom: 1px solid #dee2e6; }
        #treeTabs .nav-link { cursor: pointer; padding: 6px 12px; font-size: 14px; }

        /* 左侧树 */
        #div_tree { max-height: 65vh; overflow: auto; }
        .tree-node { user-select: none; line-height: 1.8; }
        .tree-node.active > .tree-label { font-weight: bold; color: #0c5460; }
        .twisty { cursor: pointer; display: inline-block; width: 16px; color: #888; font-size: 10px; }
        .tree-label { cursor: pointer; display: inline-flex; align-items: center; }
        .tree-label .ic { display: inline-flex; }
        .tree-label .name { margin-left: 6px; }
        .tree-children { margin-left: 0; }

        /* 最近访问（快捷方式） */
        #div_recent { max-height: 65vh; overflow: auto; }
        .recent-item { display: flex; align-items: center; padding: 6px 4px; cursor: pointer; border-radius: 4px; }
        .recent-item:hover { background: #f0f0f0; }
        .recent-item .ic { display: inline-flex; }
        .recent-item .recent-name { margin-left: 8px; flex: 1; min-width: 0; }
        .recent-item .name { font-size: 13px; }
        .recent-item .path { font-size: 11px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 右侧网格：一行4个 */
        #div_grid { display: flex; flex-wrap: wrap; }
        .grid-item {
            width: calc(25% - 16px);
            margin: 8px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 6px;
            text-align: center;
            cursor: default;
            transition: all .2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .grid-item:hover { box-shadow: 0 0 8px #0c5460; }
        .grid-item.folder { cursor: pointer; }
        .grid-item .ic { display: inline-flex; }
        .grid-item .name { font-size: 13px; margin-top: 6px; word-break: break-all; width: 100%; }
        .grid-item .size { font-size: 12px; color: #999; margin-top: 2px; }
        .grid-item .dl { font-size: 12px; color: #0c5460; margin-top: 4px; }
        .thumb { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; background: #0001; }
        .thumb-wrap { display: block; }

        @media (max-width: 768px) {
            .grid-item { width: calc(50% - 16px); }
        }

        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 9999; align-items: center; justify-content: center; }
        #lightbox img { max-width: 92%; max-height: 92%; border-radius: 6px; }
        #lightbox:after { content: "✕"; position: absolute; top: 16px; right: 22px; color: #fff; font-size: 28px; cursor: pointer; }
    </style>
</head>
<body onload="f();" onclick="if(event.target.id==='lightbox')closeLightbox();">
<div class="container">
    <br>
    <div class="card shadow">
        <div class="card-body">
            <h3 class="card-title">局域网分享</h3>
            <hr>
            <div class="row">
                <div class="col-md-4">
                    <p class="text-secondary">文件夹</p>
                    <ul class="nav nav-tabs" id="treeTabs">
                        <li class="nav-item"><a class="nav-link active" data-tab="quick" href="javascript:void(0)">快捷方式</a></li>
                        <li class="nav-item"><a class="nav-link" data-tab="tree" href="javascript:void(0)">文件树</a></li>
                    </ul>
                    <div id="panel_quick" class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-secondary" style="font-size:12px;">最近访问</span>
                                <a href="javascript:void(0)" id="btn_clear_recent" class="text-secondary" style="font-size:12px;">清空</a>
                            </div>
                            <div id="div_recent"></div>
                        </div>
                    </div>
                    <div id="panel_tree" class="card shadow-sm" style="display:none;">
                        <div class="card-body" id="div_tree"></div>
                    </div>
                </div>
                <div class="col-md-8">
                    <p class="text-secondary" id="title_replace">根目录</p>
                    <div class="card shadow-sm">
                        <div class="card-body" style="max-height:65vh; overflow:auto;">
                            <div id="div_grid"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <p class="text-secondary text-center font-italic">Powered By 兰兰想</p>
</div>

<div id="lightbox" onclick="closeLightbox();">
    <img id="lightbox_img" src="" alt="preview">
</div>

</body>
</html>
