<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>局域网连接</title>
    <link rel="stylesheet" href="./?getAssets=bootstrap.min.css">
    <script type="application/javascript" src="./?getAssets=jquary34.js"></script>
    <script type="application/javascript" src="./?getAssets=bootstrap.min.js"></script>
    <script>
        function Get(url) {
            let xmlhttprequest=new XMLHttpRequest();
            let tt=new Date();
            xmlhttprequest.open("GET",url+"&checkpass=replace_pass&time="+tt.getTime(),false);
            xmlhttprequest.send(null);
            return xmlhttprequest.responseText;
        }

        function getfile(filepath) {
            window.open("?getjson=1&checkpass=replace_pass&filepath="+filepath);
        }
        function enter(filepath,filename) {
            // https://stackoverflow.com/questions/2385113/howto-div-with-onclick-inside-another-div-with-onclick-javascript
            if (!e) var e = window.event;
            e.cancelBubble = true;
            if (e.stopPropagation) e.stopPropagation();

            document.getElementById("title_replace").innerHTML=decodeURI(filepath);
            let isopen=document.getElementById(filepath).getAttribute("data-expend");
            if (isopen=="opened"){
                document.getElementById(filepath).setAttribute("class","col-12 card text-secondary");
                document.getElementById(filepath).innerHTML=decodeURI(filename);
                document.getElementById(filepath).setAttribute("data-expend","closed");
            }else{
                document.getElementById(filepath).setAttribute("class","col-12 card shadow-lg text-success");

                let json_raw_data_folder=Get("./?getjson=1&filepath="+filepath);
                let json_raw_data_file=Get("./?getjson=1&getjson_onlyfolder=1&filepath="+filepath);
                fill_html(json_raw_data_folder,json_raw_data_file,filepath);
                document.getElementById(filepath).setAttribute("data-expend","opened");
            }


        }

        function fill_html(json_folder,json_file,element_id) {
            let json_data_folder=JSON.parse(json_folder);
            let json_data_file=JSON.parse(json_file);

            let fill_div=document.getElementById(element_id);
            let fill_div_file=document.getElementById("div_replace_all");
            let fill_string_folder="";
            let fill_string_file="";
            for(let i in json_data_folder){
                // replace_string_folder+="<a href='./?filepath="+json_raw_data[i].filepath+"'>"+json_raw_data[i].filename+"</a><br>";
                // console.log(json_raw_data[i].filepath);
                if (json_data_folder[i].isFile){
                    console.log(json_data_folder[i].filename);
                    let filename=encodeURI(json_data_folder[i].filename);
                    let filepath=encodeURI(json_data_folder[i].filepath);
                    fill_string_folder+="<div class='col-3 card overflow-hidden m-1' onclick='getfile(\""+filepath+"\");'>" +
                        "             "+json_data_folder[i].filename+
                        "              </div>";
                }else {
                    let filename=encodeURI(json_data_folder[i].filename);
                    let filepath=encodeURI(json_data_folder[i].filepath);
                    fill_string_folder+="<div class='col-3 card overflow-hidden m-1' onclick='enter(\""+filepath+"\",\""+filename+"\");' id='"+filepath+"' >" +
                        "             "+json_data_folder[i].filename+
                        "              </div>";
                }

            }
            for(let i in json_data_file){

                let filename=encodeURI(json_data_file[i].filename);
                let filepath=encodeURI(json_data_file[i].filepath);

                fill_string_file+="<div class='col-12 card overflow-hidden text-success' onclick='enter(\""+filepath+"\",\""+filename+"\");' id='"+filepath+"'>" +
                    "             "+json_data_file[i].filename+
                    "              </div>"


            }
            

            fill_div.innerHTML+=fill_string_file;
            fill_div_file.innerHTML=fill_string_folder;
            //写反了..先反着用吧

        }

        
        function change_html(folder_json) {
            let div_replace_folder=document.getElementById("div_replace_folder");
            let div_replace_all=document.getElementById("div_replace_all");

            let json_raw_data=JSON.parse(folder_json);
            let replace_string_folder="";
            let replace_string_file="";

            for(let i=0;i<json_raw_data.length;i++){
                let filename=encodeURI(json_raw_data[i].filename);
                let filepath=encodeURI(json_raw_data[i].filepath);
                // replace_string_folder+="<a href='./?filepath="+json_raw_data[i].filepath+"'>"+json_raw_data[i].filename+"</a><br>";
                // console.log(json_raw_data[i].filepath);

                replace_string_folder+="<div class='col-12 card text-success' onclick='enter(\""+filepath+"\",\""+filename+"\");' id='"+filepath+"' >" +
                        "             "+json_raw_data[i].filename+
                        "              </div>" 

                replace_string_file+="<div class='col-3 card m-1' onclick='enter(\""+filepath+"\",\""+filename+"\");' id='"+filepath+"_file"+"'>" +
                    "             "+json_raw_data[i].filename+
                    "              </div>"
            }
            div_replace_all.innerHTML=replace_string_file;
            div_replace_folder.innerHTML=replace_string_folder;
        }

        function uploadFile(upload_path) {
            document.getElementById(upload_path).setAttribute("class","dragUpload");
            console.log(upload_path);
        }

        function f() {
            let json_raw_data=Get("./?getjson=1");
            change_html(json_raw_data);

        }

    </script>
    <style>

        .card{
            transition: all .5s;
        }
        .card:hover{
            box-shadow: 0 0 8px #0c5460;
            transition: all .5s;
        }
        .dragUpload{
            border: solid 2px #1c7430;
        }
    </style>
</head>
<body onload="f();">
    <div class="container">
        <br>
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title">局域网分享</h3>
                <hr>
                <div class="row">
                    <div class="col-md-5">
                        <p class="text-secondary">文件夹列表</p>
                        <div class="card shadow-sm">
                            <div class="card-body overflow-auto" id="div_replace_folder">
                                replace_folder
                            </div>
                        </div>
                    </div>
                    <div class="col-md-7">
                        <p class="text-secondary" id="title_replace">详细</p>
                        <div class="card shadow-sm">
                            <div class="card-body overflow-auto">
                                <div class="row" id="div_replace_all">
                                    replace_all
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <p class="text-secondary text-center font-italic">Powered By 兰兰想</p>
    </div>

</body>
</html>
