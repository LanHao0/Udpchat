<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>请输入密码</title>
    <script>
        function button() {
            let url="./?checkpass="+document.getElementById("input_pass").value;
            window.location.href=url;
        }
        function hi() {
            let input=document.getElementById("input_pass");
            input.onkeypress=function (e) {
                if (e.key==='Enter'){
                    button();
                }
            }
        }
        

    </script>
    <style>
        .form{
            width: 300px;
            margin: auto;
            padding: 15px;
            text-align: center;
        }
        .form-control{
            padding: 10px;
            margin: 10px;
            outline: none;
            border: solid 1px #000;
            border-radius: 25px;
        }

    </style>
</head>
<body onload="hi();">
<br>
<br>
<br>
<div class="form">
    <input type="text" placeholder="输入密码" id="input_pass" class="form-control" autofocus/>
    <br>
    <input type="submit" value="确定" onclick="button();" class="form-control"/>
</div>

</body>
</html>
