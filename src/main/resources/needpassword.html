<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>请输入密码</title>
    <script>
        function button() {
            let url="./?checkpass="+document.getElementById("input_pass").value;
            window.location.href=url;
        }
    </script>
    <style>
        .form{
            width: 300px;
            margin: auto;
        }
    </style>
</head>
<body>
<div class="form">
    <input type="text" placeholder="输入密码" id="input_pass"/>
    <input type="button" value="确定" onclick="button();"/>
</div>

</body>
</html>
